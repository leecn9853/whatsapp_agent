name: excel_agent

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: excel_agent
      POSTGRES_USER: excel_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U excel_agent -d excel_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 阶段一：见 docs/sandbox-selfhosted-plan.md。长驻容器，DockerSandbox 通过 exec 调用它。
  sandbox:
    build: ./sandbox

volumes:
  pgdata:
