[project]
name = "thrid-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "faker>=40.36.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thrid_app"]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
]
